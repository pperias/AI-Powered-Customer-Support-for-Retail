[project]
name = "support-agent"
version = "0.1.0"
description = "AI-Powered Customer Support for Retail (capstone)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]
ui = ["gradio"]
tracing = ["arize-otel", "openinference-instrumentation-openai"]
evals = ["pydantic-evals"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
